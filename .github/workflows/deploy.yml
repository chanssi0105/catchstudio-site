name: Deploy to S3 + CloudFront

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      BUCKET_NAME: catchstudio-site-prod
      CF_DISTRIBUTION_ID: E13VOK8SZPMPFO

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (11ty)
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync dist to S3
        run: |
          aws s3 sync ./dist s3://$BUCKET_NAME --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $CF_DISTRIBUTION_ID \
            --paths "/*"

      - name: Notify IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET

          urls = [node.text for node in ET.parse("dist/sitemap.xml").getroot().findall("{*}url/{*}loc")]
          payload = {
              "host": "catch-studio.com",
              "key": "3aac8acab19f917768dd101a94ef9a70",
              "keyLocation": "https://catch-studio.com/3aac8acab19f917768dd101a94ef9a70.txt",
              "urlList": urls,
          }
          Path("indexnow-payload.json").write_text(json.dumps(payload, ensure_ascii=False), encoding="utf-8")
          PY
          curl --silent --show-error --fail-with-body \
            --connect-timeout 10 --max-time 30 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json \
            --write-out '\nIndexNow HTTP status: %{http_code}\n' \
            https://api.indexnow.org/indexnow
